<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunkBot</title>
<link rel="stylesheet" href="avatar.css">
<style>
  header .fb-avatar { --fb-size: 46px; margin-right: 4px; }
  header .fb-label { bottom: -13px; font-size: 7.5px; letter-spacing: 1.1px; }
  :root {
    --bg: #0d0f14; --panel: #151922; --line: #232936; --text: #e6e9ef;
    --dim: #8b93a7; --accent: #ffb454; --user: #1d2430; --rec: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  header b { color: var(--accent); letter-spacing: .5px; }
  header .status { color: var(--dim); font-size: 12px; margin-left: auto; }
  header button { background: none; border: 1px solid var(--line); color: var(--dim);
                  border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px;
         width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: var(--user); padding: 10px 14px; border-radius: 10px;
              border-left: 2px solid var(--accent); }
  .msg.think { color: var(--dim); font-style: italic; font-size: 13px;
               border-left: 2px solid var(--line); padding-left: 10px; }
  .msg.tool { color: var(--accent); font-family: ui-monospace, monospace;
              font-size: 12.5px; opacity: .85; }

  form { border-top: 1px solid var(--line); padding: 12px 18px; display: flex;
         gap: 10px; align-items: flex-end; max-width: 900px; width: 100%;
         margin: 0 auto; }
  textarea { flex: 1; background: var(--panel); color: var(--text);
             border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
             resize: none; font: inherit; min-height: 46px; max-height: 200px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
                 background: var(--panel); color: var(--text); cursor: pointer;
                 font-size: 18px; display: grid; place-items: center; flex: none; }
  button.round:hover { border-color: var(--accent); }
  button.round.recording { background: var(--rec); border-color: var(--rec);
                           animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  #send { background: var(--accent); color: #1a1207; border: none; font-weight: 700; }

  #panel { position: fixed; inset: 0 0 0 auto; width: min(460px, 92vw);
           background: var(--panel); border-left: 1px solid var(--line);
           transform: translateX(100%); transition: transform .2s; overflow-y: auto;
           padding: 18px; }
  #panel.open { transform: none; }
  #panel h3 { margin: 18px 0 8px; color: var(--accent); font-size: 13px;
              text-transform: uppercase; letter-spacing: .8px; }
  #panel .row { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  #panel .row small { color: var(--dim); }
</style>
</head>
<body>
<header>
  <div id="avatar"></div>
  <b>FUNKBOT</b>
  <button id="memBtn">memory</button>
  <button id="learnBtn">learn now</button>
  <span class="status" id="status">ready</span>
</header>

<div id="log"></div>

<form id="form">
  <button type="button" class="round" id="mic" title="Hold to dictate">🎤</button>
  <textarea id="input" placeholder="Talk to FunkBot…  (⏎ to send, ⇧⏎ newline)"></textarea>
  <button type="submit" class="round" id="send">↑</button>
</form>

<aside id="panel">
  <h3>Facts remembered</h3><div id="facts"></div>
  <h3>Lessons learned</h3><div id="lessons"></div>
  <h3>Dictations</h3><div id="dicts"></div>
</aside>

<script type="module">
import { FunkAvatar } from './avatar.js';
const avatar = new FunkAvatar(document.getElementById('avatar'));

const log = document.getElementById('log');
const input = document.getElementById('input');
const status = document.getElementById('status');
let sessionId = null;

function bubble(cls, text = '') {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  send(input.value.trim());
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value.trim()); }
});

async function send(text) {
  if (!text) return;
  bubble('user', text);
  input.value = '';
  status.textContent = 'thinking…';
  avatar.pulse();                 // question landed
  avatar.state = 'thinking';

  const res = await fetch('/api/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: text, session_id: sessionId}),
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', reply = null, thinking = null;

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const lines = buf.split('\n\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const ev = JSON.parse(line.slice(6));
      if (ev.type === 'session') sessionId = ev.id;
      else if (ev.type === 'thinking') {
        thinking = thinking || bubble('think');
        thinking.textContent += ev.text;
      } else if (ev.type === 'tool') {
        bubble('tool', '· ' + ev.text); reply = null;
        avatar.state = 'tool'; avatar.pulse();
      } else if (ev.type === 'text') {
        reply = reply || bubble('');
        reply.textContent += ev.text;
        avatar.state = 'speaking';
        log.scrollTop = log.scrollHeight;
      } else if (ev.type === 'done') {
        status.textContent = 'ready';
        avatar.state = 'idle';
      }
    }
  }
}

/* ---------------- mic: browser speech first, audio upload as fallback ------- */
const mic = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, recorder = null, chunks = [], listening = false;

function startBrowserSpeech() {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  let settled = '';
  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) settled += t + ' '; else interim += t;
    }
    input.value = (settled + interim).trim();
  };
  recognition.onend = () => {
    if (settled.trim()) {
      fetch('/api/dictation', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: settled.trim()}),
      });
    }
  };
  recognition.start();
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    status.textContent = 'transcribing…';
    const fd = new FormData();
    fd.append('audio', new Blob(chunks, {type: 'audio/webm'}), 'clip.webm');
    const r = await fetch('/api/transcribe', {method: 'POST', body: fd});
    const j = await r.json();
    status.textContent = 'ready';
    if (j.error) { bubble('tool', j.error); return; }
    input.value = (input.value ? input.value + ' ' : '') + j.text;
    input.focus();
  };
  recorder.start();
}

mic.addEventListener('click', async () => {
  listening = !listening;
  mic.classList.toggle('recording', listening);
  if (listening) {
    status.textContent = 'listening…';
    avatar.state = 'listening';
    if (SR) startBrowserSpeech(); else await startRecording();
  } else {
    status.textContent = 'ready';
    avatar.state = 'idle';
    if (recognition) { recognition.stop(); recognition = null; }
    if (recorder && recorder.state === 'recording') { recorder.stop(); recorder = null; }
  }
});

/* ---------------- memory panel + manual learning trigger -------------------- */
const panel = document.getElementById('panel');
document.getElementById('memBtn').onclick = async () => {
  panel.classList.toggle('open');
  if (!panel.classList.contains('open')) return;
  const m = await (await fetch('/api/memory')).json();
  document.getElementById('facts').innerHTML = m.facts.map(f =>
    `<div class="row"><b>${f.subject}</b><br><small>${f.body}</small></div>`).join('');
  document.getElementById('lessons').innerHTML = m.lessons.map(l =>
    `<div class="row">when ${l.trigger}<br><small>→ ${l.lesson} · score ${l.score}
     · depth ${l.depth}${l.retired ? ' · retired' : ''}</small></div>`).join('');
  const d = await (await fetch('/api/dictations')).json();
  document.getElementById('dicts').innerHTML = d.map(x =>
    `<div class="row"><small>${x.id}</small><br>${x.text}</div>`).join('');
};
document.getElementById('learnBtn').onclick = async () => {
  status.textContent = 'learning…';
  const r = await (await fetch('/api/learn', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId, good: true}),
  })).json();
  bubble('tool', 'learned: ' + r.result);
  status.textContent = 'ready';
};
</script>
</body>
</html>
