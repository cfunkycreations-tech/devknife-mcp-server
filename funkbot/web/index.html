<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunkBot</title>
<link rel="stylesheet" href="avatar.css">
<style>
  :root {
    --bg: #05070a; --panel: #0d1219; --line: #1c2531; --text: #e6e9ef;
    --dim: #7c879b; --green: #2bff9e; --purple: #a06cff; --hot: #ff5c5c;
    --user: #131a24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; color: var(--text); background: var(--bg);
    background-image:
      linear-gradient(rgba(43,255,158,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(43,255,158,.035) 1px, transparent 1px);
    background-size: 34px 34px;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------------------------------------------------------- header */
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(43,255,158,.05), transparent);
  }
  header .fb-avatar { --fb-size: 44px; }
  header .fb-label { bottom: -12px; font-size: 7px; letter-spacing: 1px; }
  .brand { font-weight: 800; letter-spacing: 3px; color: var(--green);
           text-shadow: 0 0 14px rgba(43,255,158,.55); }
  .badge { font: 700 9.5px/1 ui-monospace, monospace; letter-spacing: 1.2px;
           padding: 4px 8px; border-radius: 4px; border: 1px solid currentColor; }
  .badge.offline { color: var(--green); }
  .badge.down { color: var(--hot); }
  header .spacer { margin-left: auto; }
  header button { background: none; border: 1px solid var(--line); color: var(--dim);
                  border-radius: 6px; padding: 5px 10px; cursor: pointer;
                  font: 600 11px ui-monospace, monospace; letter-spacing: .5px; }
  header button:hover, header button.on { color: var(--green); border-color: var(--green); }

  /* ---------------------------------------------------------- log */
  #log { grid-column: 1; grid-row: 2; overflow-y: auto; padding: 22px 24px; }
  .msg { margin-bottom: 16px; white-space: pre-wrap; word-wrap: break-word;
         max-width: 780px; }
  .msg.user { background: var(--user); padding: 10px 14px; border-radius: 10px;
              border-left: 2px solid var(--green); }
  .msg.think { color: var(--dim); font-style: italic; font-size: 13px;
               border-left: 2px solid var(--line); padding-left: 12px;
               max-height: 150px; overflow-y: auto; }
  .msg.tool { color: var(--purple); font: 12.5px ui-monospace, monospace; }
  .msg.error { color: var(--hot); font: 12.5px ui-monospace, monospace;
               border-left: 2px solid var(--hot); padding-left: 10px; }

  /* ---------------------------------------------------------- composer */
  form { grid-column: 1; grid-row: 3; border-top: 1px solid var(--line); padding: 12px 18px;
         display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--panel); color: var(--text);
             border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
             resize: none; font: inherit; min-height: 46px; max-height: 200px; }
  textarea:focus { outline: none; border-color: var(--green); }
  button.round { width: 46px; height: 46px; border-radius: 50%; flex: none;
                 border: 1px solid var(--line); background: var(--panel);
                 color: var(--text); cursor: pointer; font-size: 18px;
                 display: grid; place-items: center; }
  button.round:hover { border-color: var(--green); }
  button.round.recording { background: var(--hot); border-color: var(--hot);
                           animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  #send { background: var(--green); color: #06180f; border: none; font-weight: 800; }

  /* ---------------------------------------------------------- HUD */
  aside { grid-column: 2; grid-row: 2 / 4; border-left: 1px solid var(--line);
          background: var(--panel);
          overflow-y: auto; padding: 14px; display: flex; flex-direction: column;
          gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px;
          position: relative; }
  .card h4 { margin: 0 0 8px; font: 700 9.5px ui-monospace, monospace;
             letter-spacing: 1.4px; color: var(--green); text-transform: uppercase; }
  .card.purple h4 { color: var(--purple); }
  .kv { display: flex; justify-content: space-between; gap: 8px;
        font: 11.5px ui-monospace, monospace; padding: 2.5px 0; color: var(--dim); }
  .kv b { color: var(--text); font-weight: 600; }
  .meter { height: 5px; background: #131a24; border-radius: 3px; overflow: hidden;
           margin-top: 7px; }
  .meter i { display: block; height: 100%; background: var(--green);
             box-shadow: 0 0 8px var(--green); transition: width .4s; }
  .meter.purple i { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
  .list { max-height: 190px; overflow-y: auto; }
  .list .row { border-bottom: 1px solid var(--line); padding: 6px 0;
               font-size: 11.5px; color: var(--dim); }
  .list .row b { color: var(--text); }

  /* ---------------------------------------------------------- approval */
  #approvals { position: fixed; right: 316px; bottom: 78px; width: 380px;
               display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .ask { background: #12161d; border: 1px solid var(--purple); border-radius: 10px;
         padding: 12px 14px; box-shadow: 0 8px 40px rgba(0,0,0,.6);
         animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }
  .ask h5 { margin: 0 0 6px; font: 700 10px ui-monospace, monospace;
            letter-spacing: 1.2px; color: var(--purple); }
  .ask pre { margin: 0 0 10px; padding: 8px; background: #05070a; border-radius: 6px;
             font: 11.5px ui-monospace, monospace; color: var(--text);
             white-space: pre-wrap; word-break: break-all; max-height: 130px;
             overflow-y: auto; }
  .ask .why { color: var(--dim); font: 10.5px ui-monospace, monospace;
              margin-bottom: 10px; }
  .ask .btns { display: flex; gap: 8px; }
  .ask button { flex: 1; padding: 7px; border-radius: 6px; cursor: pointer;
                font: 700 11px ui-monospace, monospace; border: 1px solid var(--line);
                background: #05070a; color: var(--text); }
  .ask button.yes { border-color: var(--green); color: var(--green); }
  .ask button.no  { border-color: var(--hot); color: var(--hot); }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    #approvals { right: 16px; }
  }
</style>
</head>
<body>
<header>
  <div id="avatar"></div>
  <span class="brand">FUNKBOT</span>
  <span class="badge offline mono" id="backendBadge">OFFLINE</span>
  <span class="spacer"></span>
  <button id="ttsBtn" title="speak replies aloud">🔊 VOICE</button>
  <button id="memBtn">MEMORY</button>
  <button id="learnBtn">LEARN</button>
</header>

<div id="log"></div>

<aside>
  <div class="card">
    <h4>Core</h4>
    <div class="kv"><span>model</span><b id="hModel">—</b></div>
    <div class="kv"><span>backend</span><b id="hBackend">—</b></div>
    <div class="kv"><span>tools</span><b id="hTools">—</b></div>
    <div class="kv"><span>skills</span><b id="hSkills">—</b></div>
    <div class="kv"><span>health</span><b id="hHealth">—</b></div>
  </div>

  <div class="card purple">
    <h4>Context</h4>
    <div class="kv"><span>tokens</span><b id="hCtx">0</b></div>
    <div class="meter purple"><i id="ctxBar" style="width:0%"></i></div>
    <div class="kv" style="margin-top:8px"><span>in / out</span><b id="hIO">0 / 0</b></div>
    <div class="kv"><span>requests</span><b id="hReq">0</b></div>
    <div class="kv"><span>tool calls</span><b id="hCalls">0</b></div>
  </div>

  <div class="card">
    <h4>Session</h4>
    <div class="kv"><span>id</span><b id="hSid">—</b></div>
    <div class="kv"><span>lessons live</span><b id="hLessons">0</b></div>
    <div class="kv"><span>blocked</span><b id="hBlocked">0</b></div>
    <div class="meter"><i id="actBar" style="width:0%"></i></div>
  </div>

  <div class="card purple">
    <h4>Lessons</h4>
    <div class="list" id="lessonList"></div>
  </div>

  <div class="card">
    <h4>Memory</h4>
    <div class="list" id="factList"></div>
  </div>
</aside>

<form id="form">
  <button type="button" class="round" id="mic" title="dictate">🎤</button>
  <textarea id="input" placeholder="Talk to FunkBot…  (⏎ send · ⇧⏎ newline)"></textarea>
  <button type="submit" class="round" id="send">↑</button>
</form>

<div id="approvals"></div>

<script type="module">
import { FunkAvatar } from './avatar.js';

const $ = id => document.getElementById(id);
const avatarEl = $('avatar');
const avatar = new FunkAvatar(avatarEl);
const log = $('log'), input = $('input');
let sessionId = null, speak = false;

/* -------------------------------------------------- avatar drag-to-set */
avatarEl.title = 'drop an image here to set the avatar';
avatarEl.addEventListener('dragover', e => {
  e.preventDefault(); avatarEl.classList.add('fb-dropping');
});
avatarEl.addEventListener('dragleave', () => avatarEl.classList.remove('fb-dropping'));
avatarEl.addEventListener('drop', async e => {
  e.preventDefault(); avatarEl.classList.remove('fb-dropping');
  const file = e.dataTransfer.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const fd = new FormData(); fd.append('image', file, 'funkbot.png');
  await fetch('/api/avatar', { method: 'POST', body: fd });
  avatar.setPhoto('funkbot.png'); avatar.pulse();
});

/* -------------------------------------------------- chat */
function bubble(cls, text = '') {
  const el = document.createElement('div');
  el.className = 'msg ' + cls; el.textContent = text;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}

$('form').onsubmit = e => { e.preventDefault(); send(input.value.trim()); };
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value.trim()); }
});

async function send(text) {
  if (!text) return;
  bubble('user', text);
  input.value = '';
  avatar.pulse(); avatar.state = 'thinking';

  const res = await fetch('/api/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ message: text, session_id: sessionId }),
  });

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', reply = null, thinking = null, spoken = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n'); buf = parts.pop();

    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const ev = JSON.parse(part.slice(6));

      if (ev.type === 'session') sessionId = ev.id;
      else if (ev.type === 'status') paintHud(JSON.parse(ev.text));
      else if (ev.type === 'usage') paintUsage(JSON.parse(ev.text));
      else if (ev.type === 'approval') askPermission(JSON.parse(ev.text));
      else if (ev.type === 'thinking') {
        thinking = thinking || bubble('think');
        thinking.textContent += ev.text;
        thinking.scrollTop = thinking.scrollHeight;
      } else if (ev.type === 'tool') {
        bubble('tool', '· ' + ev.text); reply = null;
        avatar.state = 'tool'; avatar.pulse();
      } else if (ev.type === 'error') {
        bubble('error', ev.text); avatar.state = 'idle';
      } else if (ev.type === 'text') {
        reply = reply || bubble('');
        reply.textContent += ev.text; spoken += ev.text;
        avatar.state = 'speaking';
        log.scrollTop = log.scrollHeight;
      } else if (ev.type === 'done') {
        avatar.state = 'idle';
        if (speak && spoken.trim()) say(spoken);
      }
    }
  }
}

/* -------------------------------------------------- permission prompts */
function askPermission(req) {
  const card = document.createElement('div');
  card.className = 'ask';
  card.innerHTML = `
    <h5>PERMISSION · ${req.tool}</h5>
    <pre>${JSON.stringify(req.args, null, 1)}</pre>
    <div class="why">${req.reason}</div>
    <div class="btns">
      <button class="yes">ALLOW</button><button class="no">DENY</button>
    </div>`;
  const answer = granted => {
    fetch('/api/approve', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id: req.id, granted }),
    });
    card.remove();
  };
  card.querySelector('.yes').onclick = () => answer(true);
  card.querySelector('.no').onclick = () => answer(false);
  $('approvals').appendChild(card);
}

/* -------------------------------------------------- HUD */
/* Paints only the fields present. The status poll carries no session until one
 * exists, and blanking what the stream already filled made live values flip
 * back to placeholders a few seconds after every reply. */
function paintHud(s) {
  if (!s) return;
  const set = (id, value) => {
    if (value !== undefined && value !== null) $(id).textContent = value;
  };
  set('hModel', s.model);
  set('hTools', s.tools);
  set('hSkills', s.skills);
  set('hLessons', s.lessons);
  if (s.session) set('hSid', s.session.slice(0, 8));
  if (s.blocked) set('hBlocked', s.blocked.length);

  if (s.backend !== undefined) {
    const up = !/UNREACHABLE/.test(s.backend);
    set('hBackend', up ? 'local · up' : 'local · down');
    const badge = $('backendBadge');
    badge.textContent = up ? 'OFFLINE ✓' : 'MODEL DOWN';
    badge.className = 'badge mono ' + (up ? 'offline' : 'down');
  }

  if (s.context_tokens !== undefined) {
    set('hCtx', s.context_tokens.toLocaleString());
    $('ctxBar').style.width =
      Math.min(100, 100 * s.context_tokens / (s.context_limit || 1)) + '%';
  }
  if (s.usage) paintUsage(s.usage);
}

function paintUsage(u) {
  $('hIO').textContent = `${(u.input || 0).toLocaleString()} / ${(u.output || 0).toLocaleString()}`;
  $('hReq').textContent = u.requests ?? 0;
  $('hCalls').textContent = u.tool_calls ?? 0;
  $('actBar').style.width = Math.min(100, (u.tool_calls || 0) * 6) + '%';
}

async function refreshStatus() {
  const s = await (await fetch('/api/status?session_id=' + (sessionId || ''))).json();
  $('hHealth').textContent = (s.health || '').split(' ')[0] || '—';
  paintHud(Object.assign(
    { model: s.model, backend: s.backend, tools: s.tools, skills: s.skills,
      lessons: s.lessons },
    s.session || {}));
  const m = await (await fetch('/api/memory')).json();
  $('lessonList').innerHTML = m.lessons.filter(l => !l.retired).slice(0, 30).map(l =>
    `<div class="row"><b>${l.trigger}</b><br>→ ${l.lesson}
     <span style="color:var(--purple)">·${l.score}</span></div>`).join('') || 'none yet';
  $('factList').innerHTML = m.facts.slice(0, 30).map(f =>
    `<div class="row"><b>${f.subject}</b><br>${f.body}</div>`).join('') || 'nothing yet';
}
refreshStatus();
setInterval(refreshStatus, 20000);

/* -------------------------------------------------- voice out */
function say(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(
    text.replace(/```[\s\S]*?```/g, ' code block ').slice(0, 1200));
  u.rate = 1.05; u.pitch = .9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
$('ttsBtn').onclick = () => {
  speak = !speak;
  $('ttsBtn').classList.toggle('on', speak);
  if (!speak) speechSynthesis.cancel();
};

/* -------------------------------------------------- voice in */
const mic = $('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, recorder = null, chunks = [], listening = false;

function startBrowserSpeech() {
  recognition = new SR();
  Object.assign(recognition, { continuous: true, interimResults: true, lang: 'en-US' });
  let settled = '';
  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) settled += t + ' '; else interim += t;
    }
    input.value = (settled + interim).trim();
  };
  recognition.onend = () => {
    if (settled.trim()) fetch('/api/dictation', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text: settled.trim() }),
    });
  };
  recognition.start();
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recorder = new MediaRecorder(stream); chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const fd = new FormData();
    fd.append('audio', new Blob(chunks, { type: 'audio/webm' }), 'clip.webm');
    const j = await (await fetch('/api/transcribe', { method: 'POST', body: fd })).json();
    if (j.error) return bubble('error', j.error);
    input.value = (input.value ? input.value + ' ' : '') + j.text;
    input.focus();
  };
  recorder.start();
}

mic.onclick = async () => {
  listening = !listening;
  mic.classList.toggle('recording', listening);
  if (listening) {
    avatar.state = 'listening';
    if (SR) startBrowserSpeech(); else await startRecording();
  } else {
    avatar.state = 'idle';
    if (recognition) { recognition.stop(); recognition = null; }
    if (recorder?.state === 'recording') { recorder.stop(); recorder = null; }
  }
};

/* -------------------------------------------------- misc buttons */
$('memBtn').onclick = refreshStatus;
$('learnBtn').onclick = async () => {
  bubble('tool', '· consolidating lessons…');
  const r = await (await fetch('/api/learn', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ session_id: sessionId, good: true }),
  })).json();
  bubble('tool', '· learned: ' + r.result);
  refreshStatus();
};
</script>
</body>
</html>
