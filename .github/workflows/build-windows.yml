name: Build FunkBot for Windows

# Builds the real Windows binary and installer on a Windows runner — PyInstaller
# cannot cross-compile, so this is how a .exe gets produced without owning a
# Windows machine. Every run uploads artifacts you can download; pushing a tag
# like v1.0.0 also publishes them as a release.
#
# Deliberately NOT run on pull requests. This account currently gets no Windows
# runner (jobs come back in seconds with runner_id 0, never assigned), so a PR
# trigger only paints every PR red without producing a build. Enable Windows
# runners under the organization's Actions settings, then add a pull_request
# trigger back if you want per-PR builds.

on:
  push:
    branches: [main]
    paths: ["funkbot/**", ".github/workflows/build-windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: funkbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: funkbot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run the test suite
        run: python -m pytest -q tests

      - name: Generate the icon
        run: python make_icon.py

      - name: Build FunkBot.exe
        run: python -m PyInstaller --noconfirm --clean FunkBot.spec

      - name: Smoke-test the binary
        shell: pwsh
        run: |
          # It must start, serve, and shut down cleanly with no model present.
          $p = Start-Process -FilePath dist\FunkBot.exe `
               -ArgumentList '--no-browser','--port','8899' -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8899/api/status `
                   -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "FunkBot.exe did not serve /api/status" }
          Write-Host "FunkBot.exe served /api/status"

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup ships on the Windows runner image.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: FunkBot-windows
          path: |
            funkbot/dist/FunkBot.exe
            funkbot/installer/FunkBot-Setup.exe
          if-no-files-found: error
          retention-days: 90

      # Uses the preinstalled gh CLI rather than a third-party action: orgs that
      # restrict Actions to GitHub-authored ones reject the job outright.
      - name: Publish a release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            dist\FunkBot.exe installer\FunkBot-Setup.exe `
            --generate-notes --title "FunkBot $env:GITHUB_REF_NAME"
